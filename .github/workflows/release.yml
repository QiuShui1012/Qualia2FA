name: Release

# Releases only on `v*` tags.
#
# Deliberately **not** on pushes to master: a Release is a public statement about a commit,
# and it should be made on purpose rather than as a side effect of merging.
#
# The tag carries the application version, and the first job checks that the two agree before
# anything is built: a Release whose tag says one thing while the artifacts inside say another
# is worse than no Release, because the version is what a user reports in a bug.
on:
  push:
    tags:
      - 'v*'
  # Manual runs only verify the tag against the version; they never create a Release.
  workflow_dispatch:

jobs:
  verify:
    name: Verify the tag matches the application version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with versionName
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'versionName = "\K[^"]+' composeApp/build.gradle.kts)
          echo "tag=$tag versionName=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version in composeApp/build.gradle.kts"
            exit 1
          fi

  # Both platform jobs publish into **one** Release: the tag names the version of the whole
  # application, and which installer a user needs is a question about their machine, not about
  # which release to look at.
  #
  # That makes the jobs independent rather than sequential, so each of them has to be safe to
  # run against a Release that may or may not exist yet -- and safe to run twice, because a tag
  # can be moved to a rewritten commit and that fires this workflow again. Both therefore
  # "create it if it is not there, then upload with --clobber", and a failure in that last
  # step is reported **without** failing the job: by then the artifacts are built, and a red
  # run would read as a build failure.
  android:
    name: Android arm64 (release APK)
    needs: verify
    # A manual trigger only runs verification: nothing is released without a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # `GITHUB_TOKEN` is read-only by default, and the last steps write to a Release. The
    # minimum permission is declared explicitly: writing repository contents, and nothing
    # else.
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install the Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;28.2.13676358"

      # The key this release is signed with. Two cases, and the job says out loud which one it
      # took:
      #
      # - The repository has the four secrets below, so that **is** the release key.
      # - It has none, so the build falls back to the Android debug key -- the same fallback a
      #   local `assembleRelease` uses when there is no `keystore.properties`. `validateSigningRelease`
      #   runs before anything is signed and needs the file to exist, and a runner has never
      #   built the debug variant, so the file is created here.
      #
      # The secrets are optional on purpose: without them the workflow still produces an
      # installable artifact, which is what a project with no signing key yet needs. Adding
      # them is the whole of what turns that artifact into a signed release.
      - name: Provide the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            cat > keystore.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPERTIES
            echo "::notice::signing with the release key from the repository secrets"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::no release keystore secret is set, so the APK is signed with the Android debug key: it installs and runs, and it is not an identity to publish under."
          fi

      - name: Cache the Rust registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-android-release-${{ hashFiles('composeApp/build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      # A release build compiles the whole Rust dependency tree -- iroh, tokio and their
      # several hundred crates -- once per profile, and the trees measured on a development
      # machine are 8.4 GB for the unpacked source plus 4.5 GB for the device target alone.
      # A runner arrives with the Android SDK, several language toolchains and container
      # images already installed, which is where its free space went. Removing what this job
      # does not use is cheaper than a build that dies with "No space left on device" twenty
      # minutes in.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          # Deliberately **not** `$AGENT_TOOLSDIRECTORY`: the JDK and the Rust toolchain were
          # set up above and live there.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images \
                      /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      # A release build is the only one worth shipping: Android refuses to optimize a
      # debuggable package, so a debug APK would be several times slower by construction and
      # would say nothing about the application a user gets.
      #
      # Signing: this step uses `keystore.properties` when the repository has one beside its
      # root, and the debug keystore otherwise -- which is the case in CI, because that file
      # is not committed. The APK still installs and runs; it is **not** signed with an
      # identity to release under, and the Release notes say so.
      #
      # A failure prints its own last lines as `::error::` annotations: reading a run's log
      # needs the API (rate-limited) or a download, while annotations are on the run page.
      - name: Build the release APK
        run: |
          set +e
          ./gradlew :composeApp:assembleRelease --stacktrace 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The *cause* is what an annotation has to carry, and a Gradle stack trace ends in
            # frames that say nothing: the failure line, the task it belongs to and the first
            # `Caused by` are what identifies it, so those are printed first and the tail only
            # follows for context.
            echo "::error::the release APK build failed"
            grep -n -m 40 -E "What went wrong|Execution failed for task|Caused by:|^e: |error\[|error: " gradle.log \
              | tail -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 25 gradle.log | while IFS= read -r line; do echo "::error::$line"; done
            df -h /
          fi
          exit "$status"

      - name: Name the APK after the tag
        run: |
          set -euo pipefail
          cp composeApp/build/outputs/apk/release/composeApp-release.apk \
             "Qualia2FA-${GITHUB_REF_NAME}-arm64.apk"

      - name: Create the Release if it is not there yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the Release already exists"
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Qualia2FA, the desktop and Android application.

          | Platform | Artifact | Notes |
          |---|---|---|
          | Android 8.0+ (64-bit ARM) | `Qualia2FA-v<version>-arm64.apk` | signed with the key the build was given; a debug-key signature installs and runs and is not an identity to publish under |
          | Windows 10/11 (x64) | `Qualia2FA-v<version>.msi`, `Qualia2FA-v<version>.exe` | not code-signed, so SmartScreen warns on first run |

          Nothing is synchronized in the background. The local-network half of pairing and
          syncing is opened while a screen that needs it is up, and the first pairing still
          reads a QR code, which is what pins the two devices to each other.
          NOTES
          # A Release created by the other job at the same moment is not a failure: what this
          # job has to do is upload, and that step needs the Release to exist, not to have been
          # created here.
          gh release create "$GITHUB_REF_NAME" \
            --title "Qualia2FA $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag || true

      - name: Upload the APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release upload "$GITHUB_REF_NAME" "Qualia2FA-${GITHUB_REF_NAME}-arm64.apk" --clobber; then
            echo "Uploaded the APK to $GITHUB_REF_NAME"
          else
            echo "::warning::the APK was built, but uploading it to the Release failed (usually a missing contents: write permission)."
          fi

  windows:
    name: Windows x64 (installers)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # A full desktop build takes under ten minutes on a cold runner.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Windows scans every file a build writes, and the desktop packaging writes an enormous
      # number of small ones: jlink assembles a runtime image and WiX authors the cabinet that
      # contains it. Excluding the directories this job works in takes that scan off the
      # critical path. The effect is printed either way -- a step that silently did nothing
      # would be worse than no step at all, because the next reader would trust it.
      - name: Exclude the build directories from Defender scanning
        shell: pwsh
        run: |
          $paths = @("$env:GITHUB_WORKSPACE", "$env:USERPROFILE\.gradle", "$env:USERPROFILE\.cargo")
          try {
            foreach ($path in $paths) { Add-MpPreference -ExclusionPath $path -ErrorAction Stop }
            Write-Host "Defender exclusions added."
            (Get-MpPreference).ExclusionPath | ForEach-Object { Write-Host "  in effect: $_" }
          } catch {
            Write-Host "::warning::could not add Defender exclusions ($($_.Exception.Message)); the build continues and simply scans more files."
          }
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('composeApp/build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-cargo-

      # MSI needs the WiX toolset and EXE needs Inno Setup; both are installed on the runner.
      # jlink builds the runtime image and jpackage the installers, so nothing here needs a
      # JDK on the machine that later runs the application.
      - name: Build the installers
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      # The other job usually creates the Release first. When it has not (a slower runner, or
      # only this job re-run), the Release is created here with the same notes, so that the
      # upload below has somewhere to put the installers either way.
      - name: Create the Release if it is not there yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the Release already exists"
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Qualia2FA, the desktop and Android application.

          | Platform | Artifact | Notes |
          |---|---|---|
          | Android 8.0+ (64-bit ARM) | `Qualia2FA-v<version>-arm64.apk` | signed with the key the build was given; a debug-key signature installs and runs and is not an identity to publish under |
          | Windows 10/11 (x64) | `Qualia2FA-v<version>.msi`, `Qualia2FA-v<version>.exe` | not code-signed, so SmartScreen warns on first run |

          Nothing is synchronized in the background. The local-network half of pairing and
          syncing is opened while a screen that needs it is up, and the first pairing still
          reads a QR code, which is what pins the two devices to each other.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "Qualia2FA $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag || true

      # The tag carries the `v` the artifacts are named with, while jpackage names its output
      # after the numeric `packageVersion` (an MSI version cannot carry a prefix). Renaming here
      # keeps one naming scheme across the platforms: `Qualia2FA-v0.0.2.msi`, and so on.
      - name: Name the installers after the tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/msi/*.msi "dist/Qualia2FA-${GITHUB_REF_NAME}.msi"
          cp composeApp/build/compose/binaries/main/exe/*.exe "dist/Qualia2FA-${GITHUB_REF_NAME}.exe"
          ls -l dist

      # SignPath signs what one request describes, and a request carries one GitHub Actions
      # artifact, so the two installers travel together as a zip and come back as the two
      # files the Release publishes. The artifact configuration describes that zip: an MSI
      # whose package is signed, and the Inno Setup executable signed as the PE file it is.
      #
      # A failure here fails the job on purpose. The installers exist by now, and uploading
      # them anyway would put unsigned binaries under a release that says it is signed, which
      # is worse than a release with no Windows artifacts at all.
      - name: Zip the installers for the signing request
        shell: pwsh
        run: |
          Compress-Archive -Path dist\*.msi, dist\*.exe -DestinationPath unsigned.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::OpenRead("$PWD/unsigned.zip").Entries |
            ForEach-Object { Write-Host "  $($_.FullName)" }

      # The signing service is reached over its REST API rather than through the GitHub
      # connector: the connector is a separate trusted build system that an organization has
      # to allow, and until it is allowed every request fails at the login step. The API needs
      # a token whose user is a submitter for the signing policy named below.
      #
      # The input is the zip the previous step built, because the artifact configuration
      # describes a zip root: one request carries one artifact, and this is how both installers
      # travel in it. The result comes back as a zip of the same shape, which the next step
      # expands so the Release keeps the two installers separate.
      - name: Sign the installers through the SignPath API
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The gallery needs its NuGet provider before it can install anything, and asking for
          # it interactively is how this step fails on a runner: there is nobody to answer the
          # prompt. Installing it up front, and trusting the gallery, keeps the step silent.
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.1.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name SignPath -Scope CurrentUser -Force -AllowClobber
          Import-Module SignPath
          $arguments = @{
            InputArtifactPath                     = "$PWD/unsigned.zip"
            ApiToken                              = $env:SIGNPATH_API_TOKEN
            OrganizationId                        = '05949a10-8af0-4006-96b0-b1e7041d6831'
            ProjectSlug                           = 'Qualia2FA'
            SigningPolicySlug                     = 'Qualia2FA'
            OutputArtifactPath                    = "$PWD/signed.zip"
            WaitForCompletion                     = $true
            WaitForCompletionTimeoutInSeconds     = 1800
            ServiceUnavailableTimeoutInSeconds    = 1800
            Description                           = "Qualia2FA $env:GITHUB_REF_NAME from $env:GITHUB_SHA"
          }
          # Empty means "the project's default artifact configuration", which is what the
          # signing request should use when the repository does not name one.
          if ($env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) {
            $arguments.ArtifactConfigurationSlug = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          }
          Submit-SigningRequest @arguments
          Get-Item "$PWD/signed.zip" | ForEach-Object { Write-Host "signed archive: $($_.Length) bytes" }
          Expand-Archive -Path "$PWD/signed.zip" -DestinationPath "$PWD/signed" -Force
          Get-ChildItem "$PWD/signed" | ForEach-Object { Write-Host "  $($_.Name)" }
      - name: Upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l signed
          if gh release upload "$GITHUB_REF_NAME" \
               signed/*.msi \
               signed/*.exe \
               --clobber; then
            echo "Uploaded the signed installers to $GITHUB_REF_NAME"
          else
            echo "::warning::the installers were signed, but uploading them to the Release failed (usually a missing contents: write permission)."
          fi
