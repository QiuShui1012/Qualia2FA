name: Release

# Releases only on `v*` tags.
#
# Deliberately **not** on pushes to master: a Release is a public statement about a commit,
# and it should be made on purpose rather than as a side effect of merging.
#
# The tag carries the application version, and the first job checks that the two agree before
# anything is built: a Release whose tag says one thing while the artifacts inside say another
# is worse than no Release, because the version is what a user reports in a bug.
on:
  push:
    tags:
      - 'v*'
  # Manual runs only verify the tag against the version; they never create a Release.
  workflow_dispatch:

jobs:
  verify:
    name: Verify the tag matches the application version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with versionName
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'versionName = "\K[^"]+' composeApp/build.gradle.kts)
          echo "tag=$tag versionName=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version in composeApp/build.gradle.kts"
            exit 1
          fi

  # Both platform jobs publish into **one** Release: the tag names the version of the whole
  # application, and which installer a user needs is a question about their machine, not about
  # which release to look at.
  #
  # That makes the jobs independent rather than sequential, so each of them has to be safe to
  # run against a Release that may or may not exist yet -- and safe to run twice, because a tag
  # can be moved to a rewritten commit and that fires this workflow again. Both therefore
  # "create it if it is not there, then upload with --clobber", and a failure in that last
  # step is reported **without** failing the job: by then the artifacts are built, and a red
  # run would read as a build failure.
  android:
    name: Android arm64 (release APK)
    needs: verify
    # A manual trigger only runs verification: nothing is released without a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # `GITHUB_TOKEN` is read-only by default, and the last steps write to a Release. The
    # minimum permission is declared explicitly: writing repository contents, and nothing
    # else.
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install the Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;28.2.13676358"

      - name: Cache the Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-android-release-${{ hashFiles('composeApp/build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      # A release build is the only one worth shipping: Android refuses to optimize a
      # debuggable package, so a debug APK would be several times slower by construction and
      # would say nothing about the application a user gets.
      #
      # Signing: this step uses `keystore.properties` when the repository has one beside its
      # root, and the debug keystore otherwise -- which is the case in CI, because that file
      # is not committed. The APK still installs and runs; it is **not** signed with an
      # identity to release under, and the Release notes say so.
      - name: Build the release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Name the APK after the tag
        run: |
          set -euo pipefail
          cp composeApp/build/outputs/apk/release/composeApp-release.apk \
             "Qualia2FA-${GITHUB_REF_NAME}-arm64.apk"

      - name: Create the Release if it is not there yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the Release already exists"
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Qualia2FA, the desktop and Android application.

          | Platform | Artifact | Notes |
          |---|---|---|
          | Android 8.0+ (64-bit ARM) | `Qualia2FA-<version>-arm64.apk` | signed with the debug keystore: it installs and runs, and it is not an identity to publish under |
          | Windows 10/11 (x64) | `.msi` installer, `.exe` installer | not code-signed, so SmartScreen warns on first run |

          Nothing is synchronized in the background. The local-network half of pairing and
          syncing is opened while a screen that needs it is up, and the first pairing still
          reads a QR code, which is what pins the two devices to each other.
          NOTES
          # A Release created by the other job at the same moment is not a failure: what this
          # job has to do is upload, and that step needs the Release to exist, not to have been
          # created here.
          gh release create "$GITHUB_REF_NAME" \
            --title "Qualia2FA $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag || true

      - name: Upload the APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release upload "$GITHUB_REF_NAME" "Qualia2FA-${GITHUB_REF_NAME}-arm64.apk" --clobber; then
            echo "Uploaded the APK to $GITHUB_REF_NAME"
          else
            echo "::warning::the APK was built, but uploading it to the Release failed (usually a missing contents: write permission)."
          fi

  windows:
    name: Windows x64 (installers)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # A full desktop build takes under ten minutes on a cold runner.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('composeApp/build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-cargo-

      # MSI needs the WiX toolset and EXE needs Inno Setup; both are installed on the runner.
      # jlink builds the runtime image and jpackage the installers, so nothing here needs a
      # JDK on the machine that later runs the application.
      - name: Build the installers
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      # The other job usually creates the Release first. When it has not (a slower runner, or
      # only this job re-run), the Release is created here with the same notes, so that the
      # upload below has somewhere to put the installers either way.
      - name: Create the Release if it is not there yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the Release already exists"
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Qualia2FA, the desktop and Android application.

          | Platform | Artifact | Notes |
          |---|---|---|
          | Android 8.0+ (64-bit ARM) | `Qualia2FA-<version>-arm64.apk` | signed with the debug keystore: it installs and runs, and it is not an identity to publish under |
          | Windows 10/11 (x64) | `.msi` installer, `.exe` installer | not code-signed, so SmartScreen warns on first run |

          Nothing is synchronized in the background. The local-network half of pairing and
          syncing is opened while a screen that needs it is up, and the first pairing still
          reads a QR code, which is what pins the two devices to each other.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "Qualia2FA $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag || true

      - name: Upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release upload "$GITHUB_REF_NAME" \
               composeApp/build/compose/binaries/main/msi/*.msi \
               composeApp/build/compose/binaries/main/exe/*.exe \
               --clobber; then
            echo "Uploaded the installers to $GITHUB_REF_NAME"
          else
            echo "::warning::the installers were built, but uploading them to the Release failed (usually a missing contents: write permission)."
          fi
