org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Compose Multiplatform depends on AndroidX artifacts on every target, including the desktop
# one, and the Android plugin refuses to compile against them without this. It is a build-wide
# assertion rather than a per-target setting, so the desktop build needs it too.
android.useAndroidX=true
